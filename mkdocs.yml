site_name: Sonri an Sonjo在额尼河畔
site_url: https://sonriansonjo.github.io/mysite/
theme:
  name: material
  language: zh
  favicon: assets/images/logic.svg
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/toggle-switch 
        name: 切换至黑夜模式

    # Palette toggle for dark mode
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换至白昼模式
  features:
    - search.suggest
    - search.highlight
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
  icon: 
    logo: material/notebook-edit
nav:
  - 首页: index.md 
  - 形式科学方法论: 
    - 形式科学方法论/index.md
  - 集合论: 
    - 集合论/index.md   
    - 初等集合论: 集合论/初等集合论.md
  - 计算理论: 
    - 计算理论/index.md
    - 自动机理论: 计算理论/自动机理论.md
    - 可计算性理论: 计算理论/可计算性理论.md
    - 计算复杂性理论: 计算理论/计算复杂性理论.md
  - 经典逻辑:
    - 经典逻辑/index.md
    - 经典命题逻辑: 经典逻辑/经典命题逻辑.md
  - 模态逻辑:
    - 模态逻辑/index.md
    - 命题模态逻辑基础: 模态逻辑/命题模态逻辑基础.md
    - 命题模态逻辑进阶: 模态逻辑/命题模态逻辑进阶.md
  - 策略推理: 
    - 策略推理/index.md
    - 交替时态逻辑: 策略推理/交替时态逻辑.md
plugins:
  - search
  - offline
  - include-markdown
markdown_extensions:
  - def_list                      # 定义列表语法
  - toc:
      permalink: ⚓︎             # 标题后生成永久链接符号
      toc_depth: 4                # 目录深度
      title: 目录
  - pymdownx.caret                # ^^插入^^
  - pymdownx.mark                 # ==高亮==
  - pymdownx.smartsymbols         # 智能符号（-> 变成 →）
  - pymdownx.tasklist:                
      custom_checkbox: true       #任务列表
  - pymdownx.arithmatex:
      generic: true
  - markdown_checklist.extension
  - footnotes
extra_css:
  - https://tikzjax.com/v1/fonts.css
extra_javascript:
  - javascripts/mathjax.js 
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://tikzjax.com/v1/tikzjax.js