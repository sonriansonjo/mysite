site_name: Sonri an Sonjo的现代逻辑手册
site_url: https://sonriansonjo.github.io/mysite/
theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: teal
    accent: deep orange
nav:
  - 首页: index.md          # 默认的首页
  - 素朴集合论: 素朴集合论.md   # 这里必须和你放进docs的文件名一模一样
  - 交替时态逻辑: 交替时态逻辑.md
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      block_tag: 'pre'  # 解决与 Material 主题的样式冲突
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js